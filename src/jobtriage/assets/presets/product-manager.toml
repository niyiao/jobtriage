	'product manager',
	'product owner',
	'product lead',
	'product director',
	'product management',
	'\bpm\b',
	'head of product',
	'vp product',
]

include_any = [
	'product',
	'manager',
	'owner',
	'lead',
	'director',
	'head',
	'\bvp\b',
]

exclude_any = [
	'engineering manager',
